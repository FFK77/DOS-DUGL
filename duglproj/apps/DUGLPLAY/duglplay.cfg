[VideoMode]           ; video mode size,  depends on your VESA BIOS
640, 480              ;  could be (1024,768)-(800,600)-(640,480) ...
[KeyboardMap]         ; keyboard map layout file
qwerteng.map
[MousePosition]       ; default mouse position in screen
0.5, 0.5              ; each value between [0.0, 1.0] relatif position starting from bottom left corner
[VerticalSynch]       ; Screen vertical synchronisation
false                 ; boolean (0|false : disabled, 1|true : enabled)
[DropFrames]          ; drop frames when decoding isn't enough fast
false                 ; boolean (0|false : disabled, 1|true : enabled)
[InterpolateUV]       ; Interpolate U and V image component, better quality but slower
false                 ; boolean (0|false : disabled, 1|true : enabled)
[FitScreen]           ; Fit Video pictures in screen (GUI Frame, or Full screen)
true                  ; boolean (0|false : disabled, 1|true : enabled)
[FullScrSmooth]       ; Smooth displayed video at Full screen
false                 ; boolean (0|false : disabled, 1|true : enabled)
[FullScrShowTime]     ; show video time on the top, left corner at full screen
true                  ; boolean (0|false : disabled, 1|true : enabled)
[FullScrShowFps]      ; show fps on top, right corner at full screen
false                 ; boolean (0|false : disabled, 1|true : enabled)
[ProgressTimeMode]    ; Progress Time display mode (0: progress, 1:remaining, 2:progress/total)
2
[EnableSound]         ; Enable sound driver loading/intilialisation and audio decoding on opened video files
true                  ; boolean (0|false : disabled, 1|true : enabled)
[SoundDriver]         ; sound driver file name
sb16.drv
[SoundSampling]       ; output sampling rate
22050                 ; usually between [8000, 44100 ]
[SoundStereo]         ; audio output is stereo ? else mono
false                 ; boolean (0|false : disabled, 1|true : enabled)
[Sound16Bits]         ; audio output is 16bits ? else 8bits
true                  ; boolean (0|false : disabled, 1|true : enabled)
[VoiceSampleSize]     ; size in samples count of a single buffer voice
2000
[VoicesRingSize]      ; recommended 6-8 or at least: [VoicesRingSize] * [VoiceSampleSize] >= [SoundSampling] / 2 (default 6)
8
[MaxVoicesRingCount]  ; max value of count of voices inside VoicesRing buffer (default 2)
2
[UseOldFFMPEGResampler] ; switch between old/new to select which is better (currently old is more stable)
true                  ; boolean (0|false : disabled, 1|true : enabled)
[MasterSoundVolume]   ; Master sound volume, between [0.0, 1.0]
1.0
[VoiceSoundVolume]    ; Voice sound volume, between [0.0, 1.0]
1.0
[OutputGain]          ; output gain, between [0.0, 1.0]
1.0
[AboutDebugInfo]      ; display debug info inside About Dialog
false                 ; boolean (0|false : disabled, 1|true : enabled)
